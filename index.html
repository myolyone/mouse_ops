<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER AGENT: MOUSE OPS</title>
<style>
  :root{
    --bg-0:#050912;
    --bg-1:#0a1220;
    --panel:#0d1a2b;
    --line:#173252;
    --cyan:#4df3ff;
    --cyan-dim:#1c6b7a;
    --magenta:#ff4dc4;
    --amber:#ffd166;
    --green:#4dff9e;
    --red:#ff4d5e;
    --text:#d9f4ff;
    --text-dim:#6f92ab;
    --font-display:'Orbitron', 'Segoe UI', sans-serif;
    --font-mono:'Share Tech Mono','Consolas',monospace;
  }
  @font-face{font-family:'Orbitron';src:local('Arial');}
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at 20% 15%, rgba(77,243,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255,77,196,0.06), transparent 45%),
      var(--bg-0);
    color:var(--text);
    font-family:var(--font-mono);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{
    position:relative;
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  .scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:49;
    box-shadow:inset 0 0 160px rgba(0,0,0,0.75);
  }
  .stage{
    position:relative;
    width:min(920px,96vw);
    height:min(600px,90vh);
    background:linear-gradient(180deg,var(--bg-1),#060b14);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 0 0 1px rgba(77,243,255,0.05), 0 0 40px rgba(77,243,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .titlebar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    font-family:var(--font-display);
    font-size:12px;letter-spacing:2px;
    color:var(--cyan);
    background:linear-gradient(90deg, rgba(77,243,255,0.06), transparent);
  }
  .titlebar .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;margin-right:6px;animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .screen{flex:1;position:relative;overflow:hidden;}

  /* ---- Common panels ---- */
  .panel-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px;
  }
  h1.logo{
    font-family:var(--font-display);
    font-size:clamp(24px,4vw,38px);
    letter-spacing:4px;
    color:var(--text);
    margin:0;
    text-shadow:0 0 18px rgba(77,243,255,0.55);
  }
  h1.logo span{color:var(--cyan);}
  .sub{color:var(--text-dim);font-size:13px;letter-spacing:1px;max-width:560px;line-height:1.7;}
  .btn{
    font-family:var(--font-mono);
    font-size:14px;letter-spacing:1px;
    background:rgba(77,243,255,0.06);
    border:1px solid var(--cyan-dim);
    color:var(--cyan);
    padding:12px 28px;
    border-radius:3px;
    cursor:pointer;
    position:relative;
    transition:all .15s ease;
  }
  .btn:hover{background:rgba(77,243,255,0.15);border-color:var(--cyan);box-shadow:0 0 16px rgba(77,243,255,0.35);transform:translateY(-1px);}
  .btn.primary{background:linear-gradient(180deg, rgba(77,243,255,0.25), rgba(77,243,255,0.08));color:#04141a;background-color:var(--cyan);border-color:var(--cyan);font-weight:bold;}
  .btn.primary:hover{box-shadow:0 0 24px rgba(77,243,255,0.6);}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}

  .missionlist{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:700px;}
  .mcard{
    width:150px;padding:14px 10px;border:1px solid var(--line);border-radius:4px;
    background:rgba(255,255,255,0.02);
    font-size:11px;color:var(--text-dim);line-height:1.5;
  }
  .mcard b{display:block;color:var(--cyan);font-size:12px;margin-bottom:4px;font-family:var(--font-display);letter-spacing:1px;}

  /* ---- HUD ---- */
  #hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 14px;
    font-size:11px;color:var(--text-dim);
    background:linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
    z-index:10;letter-spacing:1px;
    pointer-events:none;
  }
  #hud .grp{display:flex;gap:16px;}
  #hud b{color:var(--cyan);}
  #hud .timerbar{width:120px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px;}
  #hud .timerbar i{display:block;height:100%;background:var(--cyan);width:100%;transition:width .1s linear;}

  canvas{display:block;width:100%;height:100%;cursor:crosshair;}

  .toast{
    position:absolute;left:50%;top:14%;transform:translate(-50%,0);
    font-family:var(--font-display);letter-spacing:2px;font-size:22px;
    color:var(--green);text-shadow:0 0 14px currentColor;
    opacity:0;pointer-events:none;z-index:20;
  }
  .toast.bad{color:var(--red);}
  .toast.show{animation:toastpop .6s ease forwards;}
  @keyframes toastpop{0%{opacity:0;transform:translate(-50%,10px) scale(.8);}20%{opacity:1;transform:translate(-50%,0) scale(1.05);}70%{opacity:1;}100%{opacity:0;transform:translate(-50%,-14px) scale(1);}}

  .banner{
    position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);
    font-family:var(--font-display);font-size:clamp(20px,3.4vw,30px);
    letter-spacing:3px;color:var(--cyan);text-shadow:0 0 18px rgba(77,243,255,0.7);
    text-align:center;z-index:30;opacity:0;pointer-events:none;
  }
  .banner.show{animation:bannerpop 1.4s ease forwards;}
  @keyframes bannerpop{0%{opacity:0;letter-spacing:10px;}25%{opacity:1;letter-spacing:3px;}75%{opacity:1;}100%{opacity:0;}}

  /* results */
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px;}
  .statbox{border:1px solid var(--line);border-radius:4px;padding:12px 8px;background:rgba(255,255,255,0.02);}
  .statbox .v{font-family:var(--font-display);font-size:20px;color:var(--cyan);}
  .statbox .l{font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-top:4px;}

  table.lb{border-collapse:collapse;width:100%;max-width:420px;font-size:12px;}
  table.lb th,table.lb td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);}
  table.lb th{color:var(--text-dim);font-weight:normal;letter-spacing:1px;font-size:10px;}
  table.lb td.rank{color:var(--amber);font-family:var(--font-display);}
  table.lb tr.me td{color:var(--green);}

  input.nameinput{
    font-family:var(--font-mono);background:rgba(255,255,255,0.03);
    border:1px solid var(--cyan-dim);color:var(--text);padding:8px 10px;border-radius:3px;
    letter-spacing:1px;width:220px;text-align:center;
  }
  .hint{font-size:11px;color:var(--text-dim);}
  .phase-label{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--text-dim);letter-spacing:2px;z-index:10;
  }
  .lifebar{position:absolute;bottom:6px;left:14px;right:14px;z-index:10;display:flex;gap:4px;}
  .lifebar i{flex:1;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;}
  .lifebar i.on{background:var(--green);}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="vignette"></div>
<div id="app">
  <div class="stage">
    <div class="titlebar">
      <span><span class="dot"></span>CYBER AGENT // MOUSE OPS</span>
      <span id="clock">SYS.OK</span>
    </div>
    <div class="screen" id="screen"></div>
  </div>
</div>

<script>
/* =========================================================
   CYBER AGENT: MOUSE OPS
   ฝึกทักษะการใช้เมาส์ 4 ด่าน: Click / Drag&Drop / RightClick+Scroll / Maze
   ========================================================= */

const screenEl = document.getElementById('screen');
const clockEl = document.getElementById('clock');

// ---------- Global session state ----------
const Session = {
  totalScore:0,
  hits:0,
  misses:0,
  reactionTimes:[],
  phaseResults:[], // {name, score, accuracy}
  leaderboard:[] // in-memory only, resets on reload
};

function fmtPct(n){ return isFinite(n) ? Math.round(n*100)+'%' : '0%'; }
function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// simple clock in titlebar
setInterval(()=>{
  const d = new Date();
  clockEl.textContent = d.toLocaleTimeString('th-TH',{hour12:false});
},1000);

// ---------- Router ----------
function render(html){
  screenEl.innerHTML = html;
}

function goHome(){
  render(`
  <div class="panel-center">
    <h1 class="logo">CYBER <span>AGENT</span>: MOUSE OPS</h1>
    <div class="sub">
      ภารกิจลับ: คุณคือเอเจนต์ที่ถูกส่งเข้าไปในระบบเซิร์ฟเวอร์ที่ถูกไวรัสยึดครอง
      ใช้เมาส์ของคุณให้เชี่ยวชาญที่สุดเพื่อกำจัดภัยคุกคามทั้ง 4 ด่านและกู้คืนระบบให้ทันเวลา
    </div>
    <div class="missionlist">
      <div class="mcard"><b>PHASE 1</b>คลิกกำจัดไวรัส<br>ฝึกความแม่นยำ &amp; ปฏิกิริยาตอบสนอง</div>
      <div class="mcard"><b>PHASE 2</b>คัดแยกไฟล์<br>ฝึกการลาก-วาง (Drag&Drop)</div>
      <div class="mcard"><b>PHASE 3</b>ถอดรหัส<br>ฝึกคลิกขวา &amp; สกอร์ลเมาส์</div>
      <div class="mcard"><b>PHASE 4</b>กู้คืนสายสัญญาณ<br>ฝึกควบคุมเส้นทางแบบละเอียด</div>
    </div>
    <div class="btn-row">
      <button class="btn primary" onclick="startCampaign()">▶ เริ่มภารกิจ</button>
      <button class="btn ghost" onclick="showLeaderboard()">🏆 อันดับคะแนน</button>
    </div>
    <div class="hint">เล่นได้ทั้งบนคอมพิวเตอร์ (แนะนำ) — ต้องใช้เมาส์จริงเพื่อฝึกครบทุกทักษะ</div>
  </div>`);
}

function showLeaderboard(){
  const rows = Session.leaderboard
    .sort((a,b)=>b.score-a.score)
    .slice(0,10)
    .map((r,i)=>`<tr class="${r.me?'me':''}"><td class="rank">${i+1}</td><td>${r.name}</td><td>${r.score}</td><td>${r.acc}</td></tr>`)
    .join('') || `<tr><td colspan="4" style="color:var(--text-dim)">ยังไม่มีคะแนนในเซสชันนี้</td></tr>`;
  render(`
  <div class="panel-center">
    <h1 class="logo" style="font-size:24px;">🏆 อันดับผู้พิทักษ์ระบบ</h1>
    <div class="hint" style="margin-bottom:6px;">*อันดับนี้จะรีเซ็ตเมื่อโหลดหน้าใหม่ (เก็บเฉพาะระหว่างเล่นรอบนี้)</div>
    <table class="lb">
      <thead><tr><th>#</th><th>ชื่อเอเจนต์</th><th>คะแนน</th><th>ความแม่นยำ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="btn ghost" onclick="goHome()">◀ กลับหน้าแรก</button>
  </div>`);
}

// ---------- Campaign flow ----------
const PHASES = ['click','drag','decrypt','maze'];
let phaseIndex = 0;

function startCampaign(){
  Session.totalScore=0; Session.hits=0; Session.misses=0; Session.reactionTimes=[]; Session.phaseResults=[];
  phaseIndex = 0;
  runPhaseIntro();
}

function runPhaseIntro(){
  if(phaseIndex >= PHASES.length){ return showCampaignResult(); }
  const info = {
    click:{title:'PHASE 1 // กำจัดไวรัส', desc:'คลิกซ้ายให้โดนเป้าหมายสีแดงก่อนที่มันจะหายไป เป้าหมายจะเล็กลงและเร็วขึ้นเรื่อยๆ'},
    drag:{title:'PHASE 2 // คัดแยกไฟล์', desc:'ลากไฟล์แต่ละอันไปวางในช่องที่ตรงสีให้ทันเวลา ใช้เมาส์กดค้างแล้วลาก'},
    decrypt:{title:'PHASE 3 // ถอดรหัสไวรัส', desc:'คลิกขวาที่ไวรัสให้ครบตามจำนวน แล้วหมุนสกอร์ลเมาส์ให้เข็มอยู่ในโซนสีเขียวแล้วคลิกซ้ายเพื่อล็อก'},
    maze:{title:'PHASE 4 // กู้คืนสายสัญญาณ', desc:'กดเมาส์ค้างที่จุดเริ่มต้นแล้วลากผ่านเส้นทางแคบๆ ไปให้ถึงจุดหมายโดยไม่ชนผนัง'},
  }[PHASES[phaseIndex]];
  render(`
  <div class="panel-center">
    <h1 class="logo" style="font-size:22px;">${info.title}</h1>
    <div class="sub">${info.desc}</div>
    <button class="btn primary" onclick="launchPhase()">เริ่มด่านนี้</button>
  </div>`);
}

function launchPhase(){
  const name = PHASES[phaseIndex];
  if(name==='click') return PhaseClick.start();
  if(name==='drag') return PhaseDrag.start();
  if(name==='decrypt') return PhaseDecrypt.start();
  if(name==='maze') return PhaseMaze.start();
}

function finishPhase(result){
  // result: {name, hits, misses, score, reactionTimes:[]}
  Session.totalScore += result.score;
  Session.hits += result.hits;
  Session.misses += result.misses;
  if(result.reactionTimes) Session.reactionTimes.push(...result.reactionTimes);
  const acc = result.hits+result.misses>0 ? result.hits/(result.hits+result.misses) : 1;
  Session.phaseResults.push({name:result.label, score:result.score, accuracy:acc});

  const avgReact = result.reactionTimes && result.reactionTimes.length
    ? Math.round(result.reactionTimes.reduce((a,b)=>a+b,0)/result.reactionTimes.length)
    : null;

  render(`
  <div class="panel-center">
    <h1 class="logo" style="font-size:22px;color:var(--green);">✔ ด่านสำเร็จ</h1>
    <div class="statgrid">
      <div class="statbox"><div class="v">${result.score}</div><div class="l">คะแนนด่านนี้</div></div>
      <div class="statbox"><div class="v">${fmtPct(acc)}</div><div class="l">ความแม่นยำ</div></div>
      <div class="statbox"><div class="v">${avgReact!==null? avgReact+'ms':'—'}</div><div class="l">เวลาตอบสนองเฉลี่ย</div></div>
    </div>
    <button class="btn primary" onclick="nextPhase()">ต่อไป ▶</button>
  </div>`);
}

function nextPhase(){
  phaseIndex++;
  runPhaseIntro();
}

function showCampaignResult(){
  const acc = Session.hits+Session.misses>0 ? Session.hits/(Session.hits+Session.misses) : 1;
  const avgReact = Session.reactionTimes.length
    ? Math.round(Session.reactionTimes.reduce((a,b)=>a+b,0)/Session.reactionTimes.length)
    : null;
  const rows = Session.phaseResults.map(r=>`
    <tr><td>${r.name}</td><td>${r.score}</td><td>${fmtPct(r.accuracy)}</td></tr>
  `).join('');

  render(`
  <div class="panel-center">
    <h1 class="logo" style="font-size:26px;color:var(--green);text-shadow:0 0 20px var(--green);">🛰 ระบบถูกกู้คืนแล้ว!</h1>
    <div class="statgrid">
      <div class="statbox"><div class="v">${Session.totalScore}</div><div class="l">คะแนนรวม</div></div>
      <div class="statbox"><div class="v">${fmtPct(acc)}</div><div class="l">ความแม่นยำรวม</div></div>
      <div class="statbox"><div class="v">${avgReact!==null? avgReact+'ms':'—'}</div><div class="l">Reaction Time</div></div>
    </div>
    <table class="lb">
      <thead><tr><th>ด่าน</th><th>คะแนน</th><th>ความแม่นยำ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;">
      <input class="nameinput" id="agentName" maxlength="16" placeholder="ตั้งชื่อเอเจนต์ของคุณ" />
      <button class="btn primary" onclick="saveScore()">บันทึกลงอันดับ</button>
    </div>
    <div class="btn-row">
      <button class="btn ghost" onclick="startCampaign()">🔁 เล่นใหม่</button>
      <button class="btn ghost" onclick="goHome()">🏠 หน้าแรก</button>
    </div>
  </div>`);
}

function saveScore(){
  const input = document.getElementById('agentName');
  const name = (input.value || 'AGENT').trim().slice(0,16) || 'AGENT';
  const acc = Session.hits+Session.misses>0 ? Session.hits/(Session.hits+Session.misses) : 1;
  Session.leaderboard.push({name, score:Session.totalScore, acc:fmtPct(acc), me:true});
  Session.leaderboard.forEach(r=>{ if(r.name!==name) r.me=false; });
  showLeaderboard();
}

// ===================== PHASE 1: CLICK TRAINER =====================
const PhaseClick = (function(){
  let canvas, ctx, raf, running=false;
  let targets=[];
  let hits=0, misses=0, score=0, reactionTimes=[];
  let level=1, maxLevel=3;
  let levelTimeLeft=0, levelDuration=18;
  let spawnTimer=0;

  const LEVEL_CFG = [
    null,
    {spawnEvery:1.1, life:1.6, rMin:26, rMax:34, moveChance:0.0},
    {spawnEvery:0.85, life:1.25, rMin:20, rMax:28, moveChance:0.35, speed:60},
    {spawnEvery:0.6, life:0.95, rMin:14, rMax:20, moveChance:0.65, speed:110},
  ];

  function start(){
    hits=0;misses=0;score=0;reactionTimes=[];level=1;
    render(`
      <div id="hud">
        <div class="grp">PHASE 1 · LV<b id="lv">1</b> · SCORE <b id="sc">0</b></div>
        <div class="grp">TIME <span class="timerbar"><i id="tbar"></i></span></div>
      </div>
      <canvas id="cv"></canvas>
      <div class="toast" id="toast"></div>
      <div class="banner" id="banner"></div>
      <div class="phase-label">คลิกซ้ายให้โดนเป้าหมายสีแดงก่อนมันหาย</div>
    `);
    canvas = document.getElementById('cv');
    ctx = canvas.getContext('2d');
    resize(); window.addEventListener('resize', resize);
    canvas.addEventListener('mousedown', onClick);
    startLevel(1);
    running = true;
    let last = performance.now();
    function loop(t){
      if(!running) return;
      const dt = Math.min(0.05,(t-last)/1000); last = t;
      update(dt); draw();
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
  }
  function resize(){
    if(!canvas) return;
    canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  }
  function startLevel(lv){
    level = lv; targets=[]; spawnTimer=0;
    levelDuration = 18; levelTimeLeft = levelDuration;
    document.getElementById('lv').textContent = lv;
    bannerText('LEVEL '+lv);
  }
  function bannerText(t){
    const b=document.getElementById('banner'); if(!b) return;
    b.textContent=t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  }
  function toast(text,bad){
    const el=document.getElementById('toast'); if(!el) return;
    el.textContent=text; el.className='toast'+(bad?' bad':'')+' show';
    void el.offsetWidth; el.classList.add('show');
  }
  function update(dt){
    levelTimeLeft -= dt;
    const bar = document.getElementById('tbar');
    if(bar) bar.style.width = clamp(levelTimeLeft/levelDuration,0,1)*100+'%';
    const cfg = LEVEL_CFG[level];
    spawnTimer -= dt;
    if(spawnTimer<=0 && canvas){
      spawnTimer = cfg.spawnEvery * rand(0.7,1.3);
      spawnTarget(cfg);
    }
    for(const t of targets){
      t.life -= dt;
      if(t.moving){
        t.x += t.vx*dt; t.y += t.vy*dt;
        if(t.x<t.r || t.x>canvas.width-t.r) t.vx*=-1;
        if(t.y<t.r || t.y>canvas.height-t.r) t.vy*=-1;
      }
    }
    // expired targets = missed
    for(let i=targets.length-1;i>=0;i--){
      if(targets[i].life<=0){ misses++; targets.splice(i,1); updateHud(); }
    }
    if(levelTimeLeft<=0){
      if(level<maxLevel){ startLevel(level+1); }
      else { endPhase(); }
    }
  }
  function spawnTarget(cfg){
    const r = rand(cfg.rMin,cfg.rMax);
    const moving = Math.random()<cfg.moveChance;
    const angle = rand(0,Math.PI*2);
    targets.push({
      x:rand(r+10,canvas.width-r-10), y:rand(r+40,canvas.height-r-10),
      r, life:cfg.life, maxLife:cfg.life, born:performance.now(),
      moving, vx:moving?Math.cos(angle)*cfg.speed:0, vy:moving?Math.sin(angle)*cfg.speed:0
    });
  }
  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // grid bg
    ctx.strokeStyle='rgba(77,243,255,0.05)'; ctx.lineWidth=1;
    for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
    for(const t of targets){
      const pct = t.life/t.maxLife;
      ctx.save();
      ctx.translate(t.x,t.y);
      ctx.beginPath(); ctx.arc(0,0,t.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,77,94,${0.15+0.25*pct})`;
      ctx.fill();
      ctx.lineWidth=3;
      ctx.strokeStyle = '#ff4d5e';
      ctx.beginPath(); ctx.arc(0,0,t.r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
      ctx.stroke();
      ctx.fillStyle='#ffdada'; ctx.font='bold '+Math.max(10,t.r*0.6)+'px monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✕',0,1);
      ctx.restore();
    }
  }
  function onClick(e){
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    let hitIdx=-1;
    for(let i=0;i<targets.length;i++){
      const t=targets[i]; const d=Math.hypot(mx-t.x,my-t.y);
      if(d<=t.r){ hitIdx=i; break; }
    }
    if(hitIdx>=0){
      const t = targets[hitIdx];
      const rt = performance.now()-t.born;
      reactionTimes.push(rt);
      hits++; score += Math.round(100*(t.r<22?1.4:1));
      targets.splice(hitIdx,1);
      toast('+HIT',false);
    } else {
      misses++;
      toast('MISS',true);
    }
    updateHud();
  }
  function updateHud(){
    const sc=document.getElementById('sc'); if(sc) sc.textContent=score;
  }
  function endPhase(){
    running=false; cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    finishPhase({label:'คลิกกำจัดไวรัส', hits, misses, score, reactionTimes});
  }
  return {start};
})();

// ===================== PHASE 2: DRAG & DROP =====================
const PhaseDrag = (function(){
  let canvas, ctx, raf, running=false;
  let files=[], bins=[];
  let hits=0, misses=0, score=0, reactionTimes=[];
  let level=1, maxLevel=3;
  let levelTimeLeft=0, levelDuration=22;
  let spawnTimer=0;
  let dragging=null, dragOffset={x:0,y:0};
  const COLORS = [
    {name:'red', hex:'#ff4d5e'},
    {name:'cyan', hex:'#4df3ff'},
    {name:'amber', hex:'#ffd166'},
  ];
  const LEVEL_CFG=[null,
    {spawnEvery:2.2, life:8, nBins:2},
    {spawnEvery:1.7, life:6.5, nBins:3},
    {spawnEvery:1.3, life:5.5, nBins:3},
  ];

  function start(){
    hits=0;misses=0;score=0;reactionTimes=[];level=1;

      <div id="hud">
        <div class="grp">PHASE 2 · LV<b id="lv">1</b> · SCORE <b id="sc">0</b></div>

    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('mouseleave', onUp);
    startLevel(1);
    running=true;
    let last=performance.now();
    function loop(t){
      if(!running) return;
      const dt=Math.min(0.05,(t-last)/1000); last=t;
      update(dt); draw();
      raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
  }
  function resize(){ if(!canvas) return; canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight; setupBins(); }
  function setupBins(){
    const cfg = LEVEL_CFG[level];
    const n = cfg.nBins;
    bins=[];
    const w = 110, gap = 24;
    const totalW = n*w+(n-1)*gap;
    const startX = (canvas.width-totalW)/2;
    for(let i=0;i<n;i++){
      bins.push({x:startX+i*(w+gap), y:canvas.height-90, w, h:70, color:COLORS[i].hex, name:COLORS[i].name});
    }
  }
  function startLevel(lv){
    level=lv; files=[]; spawnTimer=0.4;
    levelDuration=22; levelTimeLeft=levelDuration;
    document.getElementById('lv').textContent=lv;
    setupBins();
    bannerText('LEVEL '+lv);
  }
  function bannerText(t){ const b=document.getElementById('banner'); if(!b)return; b.textContent=t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
  function toast(text,bad){ const el=document.getElementById('toast'); if(!el)return; el.textContent=text; el.className='toast'+(bad?' bad':'')+' show'; void el.offsetWidth; el.classList.add('show'); }
  function update(dt){
    levelTimeLeft-=dt;
    const bar=document.getElementById('tbar'); if(bar) bar.style.width=clamp(levelTimeLeft/levelDuration,0,1)*100+'%';
    const cfg=LEVEL_CFG[level];
    spawnTimer-=dt;
    if(spawnTimer<=0 && canvas){
      spawnTimer = cfg.spawnEvery*rand(0.8,1.2);
      spawnFile(cfg);
    }
    for(const f of files){ if(f!==dragging) f.life -= dt; }
    for(let i=files.length-1;i>=0;i--){
      if(files[i].life<=0 && files[i]!==dragging){ misses++; files.splice(i,1); updateHud(); }
    }
    if(levelTimeLeft<=0){
      if(level<maxLevel) startLevel(level+1); else endPhase();
    }
  }
  function spawnFile(cfg){
    const c = COLORS[Math.floor(rand(0,bins.length))];
    files.push({
      x:rand(40,canvas.width-40), y:rand(50,canvas.height-200),
      w:46,h:36, color:c.hex, name:c.name, life:cfg.life, maxLife:cfg.life, born:performance.now(), dragged:false
    });
  }
  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(77,243,255,0.05)';
    for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    // bins
    for(const b of bins){
      ctx.save();
      ctx.strokeStyle=b.color; ctx.lineWidth=2;
      ctx.fillStyle=b.color+'22';
      ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,6); ctx.fill(); ctx.stroke();
      ctx.fillStyle=b.color; ctx.font='11px monospace'; ctx.textAlign='center';
      ctx.fillText(b.name.toUpperCase()+'_BIN', b.x+b.w/2, b.y+b.h+14);
      ctx.restore();
    }
    for(const f of files){
      const pct = f.life/f.maxLife;
      ctx.save();
      ctx.translate(f.x,f.y);
      ctx.fillStyle = f.color;
      ctx.globalAlpha = f===dragging?1:(0.35+0.55*pct);
      ctx.beginPath(); ctx.roundRect(-f.w/2,-f.h/2,f.w,f.h,4); ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle='#fff8'; ctx.lineWidth=1; ctx.strokeRect(-f.w/2,-f.h/2,f.w,f.h);
      ctx.fillStyle='#04141a'; ctx.font='9px monospace'; ctx.textAlign='center';
      ctx.fillText('FILE', 0,4);
      ctx.restore();
    }
  }
  function onDown(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    for(let i=files.length-1;i>=0;i--){
      const f=files[i];
      if(mx>f.x-f.w/2 && mx<f.x+f.w/2 && my>f.y-f.h/2 && my<f.y+f.h/2){
        dragging=f; dragOffset.x=mx-f.x; dragOffset.y=my-f.y; break;
      }
    }
  }
  function onMove(e){
    if(!dragging) return;
    const rect=canvas.getBoundingClientRect();
    dragging.x = e.clientX-rect.left-dragOffset.x;
    dragging.y = e.clientY-rect.top-dragOffset.y;
  }
  function onUp(e){
    if(!dragging) return;
    const f = dragging;
    let dropped=false;
    for(const b of bins){
      if(f.x>b.x-10 && f.x<b.x+b.w+10 && f.y>b.y-10 && f.y<b.y+b.h+10){
        dropped=true;
        if(b.name===f.name){
          hits++; score+=120; reactionTimes.push(f.maxLife*1000 - f.life*1000);
          toast('SORTED ✓',false);
        } else {
          misses++; toast('WRONG BIN',true);
        }
        files.splice(files.indexOf(f),1);
        break;
      }
    }
    dragging=null;
    updateHud();
  }
  function updateHud(){ const sc=document.getElementById('sc'); if(sc) sc.textContent=score; }
  function endPhase(){
    running=false; cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    finishPhase({label:'คัดแยกไฟล์ (Drag&Drop)', hits, misses, score, reactionTimes});
  }
  return {start};
})();

// ===================== PHASE 3: RIGHT-CLICK + SCROLL DECRYPT =====================
const PhaseDecrypt = (function(){
  let canvas, ctx, raf, running=false;
  let hits=0, misses=0, score=0, reactionTimes=[];
  let level=1, maxLevel=3;
  let targetsToDecrypt, decryptedCount;
  let virus=null; // current big virus {x,y,r,clicksNeeded,clicksDone}
  let mode='seek'; // 'seek' (find & rightclick) | 'slider' (scroll puzzle)
  let sliderVal=0, sliderTarget=0, sliderZone=0.12, sliderSpeed=0;
  let startedAt=0;

  const LEVEL_CFG=[null,
    {need:2, clicksNeeded:2, zone:0.28},
    {need:3, clicksNeeded:3, zone:0.22},
    {need:3, clicksNeeded:4, zone:0.17},
  ];

  function start(){
    hits=0;misses=0;score=0;reactionTimes=[];level=1;
    render(`
      <div id="hud">
        <div class="grp">PHASE 3 · LV<b id="lv">1</b> · SCORE <b id="sc">0</b></div>
        <div class="grp">เป้าหมาย <b id="cnt">0</b>/<b id="need">0</b></div>
      </div>
      <canvas id="cv"></canvas>
      <div class="toast" id="toast"></div>
      <div class="banner" id="banner"></div>
      <div class="phase-label" id="hintLabel">คลิกขวาที่ไวรัสเพื่อเริ่มถอดรหัส</div>
    `);
    canvas = document.getElementById('cv');
    ctx = canvas.getContext('2d');
    resize(); window.addEventListener('resize', resize);
    canvas.addEventListener('contextmenu', e=>e.preventDefault());
    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('wheel', onWheel, {passive:false});
    startLevel(1);
    running=true;
    let last=performance.now();
    function loop(t){
      if(!running) return;
      const dt=Math.min(0.05,(t-last)/1000); last=t;
      draw();
      raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
  }
  function resize(){ if(!canvas) return; canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight; }
  function startLevel(lv){
    level=lv; targetsToDecrypt = LEVEL_CFG[lv].need; decryptedCount=0;
    document.getElementById('lv').textContent=lv;
    document.getElementById('need').textContent=targetsToDecrypt;
    document.getElementById('cnt').textContent=0;
    bannerText('LEVEL '+lv);
    spawnVirus();
  }
  function bannerText(t){ const b=document.getElementById('banner'); if(!b)return; b.textContent=t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
  function toast(text,bad){ const el=document.getElementById('toast'); if(!el)return; el.textContent=text; el.className='toast'+(bad?' bad':'')+' show'; void el.offsetWidth; el.classList.add('show'); }
  function spawnVirus(){
    mode='seek';
    const cfg=LEVEL_CFG[level];
    virus = {
      x:rand(80,canvas.width-80), y:rand(80,canvas.height-140),
      r:44, clicksNeeded:cfg.clicksNeeded, clicksDone:0
    };
    startedAt = performance.now();
    document.getElementById('hintLabel').textContent = 'คลิกขวาที่ไวรัสซ้ำๆ เพื่อเริ่มถอดรหัส ('+virus.clicksNeeded+' ครั้ง)';
  }
  function onMouseDown(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    if(mode==='seek' && e.button===2 && virus){
      const d=Math.hypot(mx-virus.x,my-virus.y);
      if(d<=virus.r){
        virus.clicksDone++;
        toast('DECRYPT '+virus.clicksDone+'/'+virus.clicksNeeded,false);
        if(virus.clicksDone>=virus.clicksNeeded){
          enterSliderMode();
        }
      } else {
        misses++; toast('MISS',true); updateHud();
      }
    } else if(mode==='slider' && e.button===0){
      // lock attempt
      const inZone = Math.abs(sliderVal - sliderTarget) <= sliderZone/2;
      if(inZone){
        hits++; score+=180;
        reactionTimes.push(performance.now()-startedAt);
        decryptedCount++;
        document.getElementById('cnt').textContent = decryptedCount;
        toast('LOCKED ✓',false);
        updateHud();
        if(decryptedCount>=targetsToDecrypt){
          if(level<3){ startLevel(level+1); } else { endPhase(); }
        } else {
          spawnVirus();
        }
      } else {
        misses++; toast('OFF TARGET',true); updateHud();
      }
    }
  }
  function enterSliderMode(){
    mode='slider';
    sliderVal = rand(-1,1);
    sliderTarget = rand(-0.6,0.6);
    sliderZone = LEVEL_CFG[level].zone;
    document.getElementById('hintLabel').textContent = 'สกอร์ลเมาส์เพื่อขยับเข็มให้อยู่ในโซนสีเขียว แล้วคลิกซ้ายเพื่อล็อก';
  }
  function onWheel(e){
    if(mode!=='slider') return;
    e.preventDefault();
    // Normalize delta across devices: mice fire large discrete ticks (~100-120),
    // trackpads fire many small continuous ones, and deltaMode can be lines/pages.
    // Convert everything to an approximate "pixel" scale first, then clamp per-event
    // movement so a fast trackpad fling can't fling the needle past the zone.
    let d = e.deltaY;
    if(e.deltaMode === 1) d *= 16;      // line mode -> approx pixels
    else if(e.deltaMode === 2) d *= 400; // page mode -> approx pixels
    d = clamp(d, -60, 60);
    sliderVal = clamp(sliderVal + d*0.0022, -1, 1);
  }
  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(77,243,255,0.05)';
    for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    if(mode==='seek' && virus){
      ctx.save();
      ctx.translate(virus.x,virus.y);
      const pulse = 1+0.05*Math.sin(performance.now()/200);
      ctx.scale(pulse,pulse);
      ctx.beginPath(); ctx.arc(0,0,virus.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,209,102,0.15)'; ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle='#ffd166'; ctx.stroke();
      ctx.fillStyle='#ffd166'; ctx.font='bold 13px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('R-CLICK', 0, 0);
      ctx.fillText(virus.clicksDone+'/'+virus.clicksNeeded, 0, 18);
      ctx.restore();
    }
    if(mode==='slider'){
      const cx = canvas.width/2, cy = canvas.height/2;
      const barW = Math.min(500,canvas.width*0.7), barH=26;
      const bx = cx-barW/2, by=cy-barH/2;
      const inZoneNow = Math.abs(sliderVal - sliderTarget) <= sliderZone/2;
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,0.04)';
      ctx.fillRect(bx,by,barW,barH);
      // green zone (with brighter border so the edges read clearly)
      const zoneX = bx + barW*((sliderTarget - sliderZone/2)+1)/2;
      const zoneW = barW*sliderZone/2;
      ctx.fillStyle='rgba(77,255,158,0.35)';
      ctx.fillRect(zoneX,by,zoneW,barH);
      ctx.strokeStyle='#4dff9e'; ctx.lineWidth=1.5;
      ctx.strokeRect(zoneX,by,zoneW,barH);
      // needle - glows green in real time when inside the zone so kids get instant feedback
      const nx = bx + barW*(sliderVal+1)/2;
      ctx.strokeStyle = inZoneNow ? '#4dff9e' : '#ff4dc4';
      ctx.lineWidth = inZoneNow ? 6 : 4;
      ctx.shadowColor = inZoneNow ? '#4dff9e' : 'transparent';
      ctx.shadowBlur = inZoneNow ? 14 : 0;
      ctx.beginPath(); ctx.moveTo(nx,by-10); ctx.lineTo(nx,by+barH+10); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,barW,barH);
      // label under the bar telling the player exactly what to do
      ctx.fillStyle = inZoneNow ? '#4dff9e' : 'var(--text-dim)';
      ctx.font='11px monospace'; ctx.textAlign='center';
      ctx.fillText(inZoneNow ? 'อยู่ในโซนแล้ว! คลิกซ้ายตอนนี้' : 'สกอร์ลจนเข็มเข้าโซนเขียว', cx, by+barH+30);
      ctx.restore();
    }
  }
  function updateHud(){ const sc=document.getElementById('sc'); if(sc) sc.textContent=score; }
  function endPhase(){
    running=false; cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    finishPhase({label:'ถอดรหัส (คลิกขวา+สกอร์ล)', hits, misses, score, reactionTimes});
  }
  return {start};
})();

// ===================== PHASE 4: MAZE / CABLE ROUTING =====================
const PhaseMaze = (function(){
  let canvas, ctx, raf, running=false;
  let hits=0, misses=0, score=0, reactionTimes=[];
  let level=1, maxLevel=3;
  let path=[], pathWidth=34;
  let dragging=false, cursorPos=null, progress=0, startedAt=0, attempts=0;
  let startPt, endPt;

  function start(){
    hits=0;misses=0;score=0;reactionTimes=[];level=1;
    render(`
      <div id="hud">
        <div class="grp">PHASE 4 · LV<b id="lv">1</b> · SCORE <b id="sc">0</b></div>
        <div class="grp">ครั้งที่พลาด <b id="miss">0</b></div>
      </div>
      <canvas id="cv"></canvas>
      <div class="toast" id="toast"></div>
      <div class="banner" id="banner"></div>
      <div class="phase-label">กดเมาส์ค้างที่จุดเริ่มต้น (สีเขียว) แล้วลากผ่านเส้นทางไปจุดหมาย (สีม่วง) ห้ามชนผนัง</div>
    `);
    canvas = document.getElementById('cv');
    ctx = canvas.getContext('2d');
    resize(); window.addEventListener('resize', resize);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    startLevel(1);
    running=true;
    let last=performance.now();
    function loop(t){
      if(!running) return;
      draw();
      raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
  }
  function resize(){ if(!canvas) return; canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight; buildPath(); }
  function startLevel(lv){
    level=lv; attempts=0;
    pathWidth = [null,42,32,24][lv];
    document.getElementById('lv').textContent=lv;
    document.getElementById('miss').textContent=0;
    buildPath();
    bannerText('LEVEL '+lv);
    resetRun();
  }
  function bannerText(t){ const b=document.getElementById('banner'); if(!b)return; b.textContent=t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
  function toast(text,bad){ const el=document.getElementById('toast'); if(!el)return; el.textContent=text; el.className='toast'+(bad?' bad':'')+' show'; void el.offsetWidth; el.classList.add('show'); }

  function buildPath(){
    if(!canvas) return;
    const w=canvas.width, h=canvas.height;
    const segs = 5 + level; // more turns per level
    path = [];
    let x = 60, y = h/2 + rand(-40,40);
    path.push({x,y});
    const dir = 1;
    for(let i=0;i<segs;i++){
      const goingRight = i%2===0;
      if(goingRight){
        x += (w-120)/Math.ceil(segs/2+1);
        path.push({x,y});
      } else {
        const ny = (y < h/2) ? rand(h*0.6,h*0.85) : rand(h*0.15,h*0.4);
        path.push({x,y:ny});
        y = ny;
      }
    }
    x = w-60;
    path.push({x,y});
    startPt = path[0];
    endPt = path[path.length-1];
  }
  function resetRun(){
    dragging=false; cursorPos=null; progress=0; startedAt=0;
  }
  function distToSegment(p,a,b){
    const abx=b.x-a.x, aby=b.y-a.y;
    const apx=p.x-a.x, apy=p.y-a.y;
    const len2 = abx*abx+aby*aby || 1;
    let t = (apx*abx+apy*aby)/len2;
    t = clamp(t,0,1);
    const cx=a.x+abx*t, cy=a.y+aby*t;
    return {d:Math.hypot(p.x-cx,p.y-cy), t, seg:{cx,cy}};
  }
  function nearestOnPath(p){
    let best=null;
    for(let i=0;i<path.length-1;i++){
      const r = distToSegment(p,path[i],path[i+1]);
      const globalT = (i + r.t)/(path.length-1);
      if(!best || r.d<best.d) best={...r, globalT, idx:i};
    }
    return best;
  }
  function onDown(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const d = Math.hypot(mx-startPt.x,my-startPt.y);
    if(d<=26){
      dragging=true; startedAt=performance.now(); attempts++;
      progress=0;
    }
  }
  function onMove(e){
    if(!dragging) return;
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    cursorPos={x:mx,y:my};
    const near = nearestOnPath(cursorPos);
    if(near.d > pathWidth/2){
      // hit wall -> fail this attempt
      misses++;
      document.getElementById('miss').textContent = misses;
      toast('ชนผนัง! เริ่มใหม่',true);
      dragging=false; cursorPos=null;
      return;
    }
    progress = Math.max(progress, near.globalT);
    const dEnd = Math.hypot(mx-endPt.x,my-endPt.y);
    if(dEnd<=22 && progress>0.85){
      // success
      const rt = performance.now()-startedAt;
      reactionTimes.push(rt);
      hits++;
      score += Math.max(80, Math.round(400-attempts*40));
      dragging=false; cursorPos=null;
      toast('เชื่อมต่อสำเร็จ ✓',false);
      updateHud();
      if(level<maxLevel){ setTimeout(()=>startLevel(level+1),500); }
      else { setTimeout(endPhase,500); }
    }
  }
  function onUp(){
    if(dragging){
      // released early without reaching end - not counted as wall hit, just reset
      dragging=false; cursorPos=null;
    }
  }
  function draw(){
    if(!ctx) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(77,243,255,0.05)';
    for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
    // corridor
    ctx.save();
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle='rgba(77,243,255,0.10)';
    ctx.lineWidth=pathWidth;
    ctx.beginPath();
    path.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
    ctx.strokeStyle='rgba(77,243,255,0.35)';
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.restore();
    // start / end
    ctx.save();
    ctx.beginPath(); ctx.arc(startPt.x,startPt.y,18,0,Math.PI*2);
    ctx.fillStyle='rgba(77,255,158,0.25)'; ctx.fill();
    ctx.strokeStyle='#4dff9e'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#4dff9e'; ctx.font='10px monospace'; ctx.textAlign='center';
    ctx.fillText('START', startPt.x, startPt.y+32);

    ctx.beginPath(); ctx.arc(endPt.x,endPt.y,18,0,Math.PI*2);
    ctx.fillStyle='rgba(255,77,196,0.25)'; ctx.fill();
    ctx.strokeStyle='#ff4dc4'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ff4dc4';
    ctx.fillText('END', endPt.x, endPt.y+32);
    ctx.restore();
    // cable being dragged
    if(dragging && cursorPos){
      ctx.save();
      ctx.strokeStyle='#4df3ff'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(startPt.x,startPt.y); ctx.lineTo(cursorPos.x,cursorPos.y); ctx.stroke();
      ctx.beginPath(); ctx.arc(cursorPos.x,cursorPos.y,8,0,Math.PI*2);
      ctx.fillStyle='#4df3ff'; ctx.fill();
      ctx.restore();
    }
  }
  function updateHud(){ const sc=document.getElementById('sc'); if(sc) sc.textContent=score; }
  function endPhase(){
    running=false; cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    finishPhase({label:'กู้คืนสายสัญญาณ (Maze)', hits, misses, score, reactionTimes});
  }
  return {start};
})();

// score HUD updater hook (shared)
const _origFinish = finishPhase;

// init
goHome();
</script>
